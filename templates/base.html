{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Platform bagi mahasiswa UI untuk memberikan atau menjual barang bekas layak pakai, supaya barang tidak terbuang dan kebutuhan kost lebih murah.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/lobby.css' %}">
  {% block meta %}
  {% endblock meta %}
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#" aria-label="UIKembali, beranda">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="16" fill="#ffc800"/>
          <path d="M16 7.5a8.5 8.5 0 1 0 8.2 10.7" fill="none" stroke="#14213d" stroke-width="3" stroke-linecap="round"/>
          <path d="M20 4.5l5.2 3.4-4.6 4.6z" fill="#14213d"/>
        </svg>
        <span>UIKembali</span>
      </a>

      <nav class="main-nav" aria-label="Navigasi utama">
        <a href="#cara-kerja">Cara kerja</a>
        <a href="#fitur">Fitur</a>
        <a href="{% url 'auth_ssoui:login' %}" class="btn btn-small">Masuk dengan SSO UI</a>
      </nav>
    </div>
  </header>

  {% block content %}
  {% endblock content%}

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>UIKembali, proyek PBP kelas B Kelompok 2.</p>
      <p>Kurangi sampah, perpanjang umur barang.</p>
    </div>
  </footer>

</body>
</html>
