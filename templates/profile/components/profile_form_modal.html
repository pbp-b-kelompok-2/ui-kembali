<form method="post"
      enctype="multipart/form-data"
      hx-post="{{ form_action|default:'' }}"
      hx-target="this"
      hx-swap="outerHTML">
  {% csrf_token %}

  <!-- Header -->
  <div class="flex items-start justify-between mb-6">
    <div>
      <h2 class="text-[1.2rem] font-extrabold font-display text-ink tracking-tight">Informasi profil</h2>
      <p class="mt-0.5 text-[0.8125rem] text-ink-muted">Nama dan fakultas disinkronkan dari UI SSO.</p>
    </div>
    <button
      type="submit"
      class="inline-flex items-center gap-[0.45rem] px-5 py-[0.6rem] bg-green text-white border-0 rounded-[10px] font-semibold text-sm whitespace-nowrap flex-shrink-0 cursor-pointer transition-all duration-150 hover:bg-green-dark hover:-translate-y-px hover:shadow-md active:translate-y-0"
    >
      Simpan perubahan
    </button>
  </div>

  <!-- Form Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 form-grid">
    {% for field in form %}
      {% if field.name == "bio" %}
      <div class="form-group flex flex-col gap-1.5 sm:col-span-2">
      {% else %}
      <div class="form-group flex flex-col gap-1.5">
      {% endif %}
        <label for="{{ field.id_for_label }}" class="text-[0.8125rem] font-semibold text-ink">
          {{ field.label }}
        </label>
        {{ field }}
        {% for error in field.errors %}
          <small class="text-red text-xs mt-0.5">{{ error }}</small>
        {% endfor %}
      </div>
    {% endfor %}
  </div>
</form>

<style>
  /* Styling untuk field Django form yang di-render oleh {{ field }} */
  .form-group input,
  .form-group textarea,
  .form-group select {
    padding: 0.65rem 0.85rem;
    border: 1px solid #d8dce4;
    border-radius: 10px;
    font-size: 0.875rem;
    color: #14213d;
    background: #ffffff;
    transition: border-color 0.2s, box-shadow 0.2s;
    resize: vertical;
    width: 100%;
    font-family: inherit;
  }
  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus {
    outline: none;
    border-color: #1f7a4d;
    box-shadow: 0 0 0 3px #dff1e6;
  }
  .form-group input::placeholder,
  .form-group textarea::placeholder {
    color: #7a8194;
  }
  /* pfp file upload custom */
  .pfp-file-label {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    max-width: 100%;
    min-width: 0;
  }
  .pfp-file-btn {
    flex-shrink: 0;
    padding: 6px 12px;
    border: 1px solid #d8dce4;
    border-radius: 6px;
    font-size: 0.875rem;
    color: #14213d;
    background: #f6f7f9;
    cursor: pointer;
  }
  .pfp-file-name {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #7a8194;
    font-size: 0.9rem;
  }
</style>
