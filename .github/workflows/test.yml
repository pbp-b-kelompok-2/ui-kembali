name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Selenium tests need a browser + CDN access, so they only run locally.
      - run: coverage run manage.py test --exclude-tag=functional
      - run: coverage report --include="katalog/*" --omit="*/tests/*,*/migrations/*" --fail-under=90
