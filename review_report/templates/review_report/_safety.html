{% load static %}
<aside class="space-y-4 md:col-span-2 xl:col-span-1">
  <section class="rounded-2xl border border-line bg-surface p-5">
    <h2 class="flex items-center gap-2 font-bold"><img src="{% static 'review_report/icons/flag.svg' %}" alt="">Ada masalah?</h2>
    <p class="mt-3 text-sm text-ink-2">Laporan ditinjau secara rahasia oleh petugas berizin.</p>
    <div class="mt-4 grid gap-3">
      {% if not deal.item.is_deleted %}<a class="flex items-center gap-2 rounded-xl bg-danger-bg p-3 text-sm font-semibold text-danger" href="{% url 'review_report:report_item' deal.item_id %}"><img class="shrink-0" src="{% static 'review_report/icons/package-x.svg' %}" alt=""><span class="flex-1">Laporkan Barang</span><img class="shrink-0" src="{% static 'review_report/icons/chevron-right.svg' %}" alt=""></a>{% endif %}
      <a class="flex items-center gap-2 rounded-xl bg-danger-bg p-3 text-sm font-semibold text-danger" href="{% url 'review_report:report_user' deal.item.owner_id %}"><img class="shrink-0" src="{% static 'review_report/icons/user-x.svg' %}" alt=""><span class="flex-1">Laporkan Pengguna</span><img class="shrink-0" src="{% static 'review_report/icons/chevron-right.svg' %}" alt=""></a>
    </div>
  </section>
  <section class="rounded-2xl bg-subtle p-5 text-brand"><img class="mb-3" src="{% static 'review_report/icons/recycle1.svg' %}" alt=""><h2 class="font-bold">Jaga siklusnya berjalan</h2><p class="mt-3 text-sm">Saat tak lagi dipakai, pasang kembali barang ini agar manfaatnya berlanjut.</p><a class="mt-4 block rounded-lg border border-line bg-surface p-3 text-center text-sm font-semibold" href="{% url 'main:lobby' %}">Kembali ke beranda</a></section>
</aside>
