{% if page_obj.has_other_pages %}<nav class="mt-6 flex flex-wrap items-center justify-center gap-4" aria-label="Halaman daftar">{% if page_obj.has_previous %}<a class="rounded-lg border border-line bg-surface px-4 py-2" href="?{{ querystring }}&amp;page={{ page_obj.previous_page_number }}" hx-get="?{{ querystring }}&amp;page={{ page_obj.previous_page_number }}" hx-target="#rr-content" hx-swap="outerHTML" hx-push-url="true">Sebelumnya</a>{% endif %}<span>Halaman {{ page_obj.number }} dari {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="rounded-lg border border-line bg-surface px-4 py-2" href="?{{ querystring }}&amp;page={{ page_obj.next_page_number }}" hx-get="?{{ querystring }}&amp;page={{ page_obj.next_page_number }}" hx-target="#rr-content" hx-swap="outerHTML" hx-push-url="true">Berikutnya</a>{% endif %}</nav>{% endif %}
